# The corpus: public Dutch infrastructure documents.
#
# Only this manifest is committed. The PDFs are publicly downloadable but
# copyrighted, so they're kept out of git; `scripts/01_download.py` fetches
# them into data/raw/.
#
# The mix is deliberate: a long design guideline, project-specific requirement
# specs (numbered requirements, the stuff Strukton extracts), a programme of
# requirements, rail design rules, and an FAQ.

